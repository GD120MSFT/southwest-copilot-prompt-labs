<script>
const B64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decryptPayload(pass){
  const blob = JSON.parse(atob(document.getElementById('payload').textContent.trim()));
  const salt = B64(blob.s), iv = B64(blob.i), ct = B64(blob.c);
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:blob.n, hash:'SHA-256'},
                km, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, ct);
  return JSON.parse(new TextDecoder().decode(pt));
}
const gerr = document.getElementById('gerr');

/* Pasting the passphrase out of an invite drags along invisible damage: a
   trailing space or newline, a non-breaking space, or a hyphen the mail client
   autocorrected into an en dash. Each one fails against an otherwise correct
   passphrase, so try the repaired forms before giving up. The canonical
   passphrase is lower case, so a lower-cased attempt costs no real entropy. */
function passVariants(raw){
  const cleaned = String(raw == null ? '' : raw)
    .replace(/[\u200B-\u200D\uFEFF]/g, '')
    .replace(/[\u00A0\u2007\u202F]/g, ' ')
    .trim();
  const straight = cleaned
    .replace(/[\u2010-\u2015\u2212]/g, '-')
    .replace(/[\u2018\u2019\u201B\u2032]/g, "'")
    .replace(/[\u201C\u201D\u2033]/g, '"');
  const out = [];
  for(const v of [cleaned, straight, straight.replace(/\s+/g,''),
                  straight.toLowerCase(), straight.toLowerCase().replace(/\s+/g,'')]){
    if(v && out.indexOf(v) === -1) out.push(v);
  }
  return out;
}

async function tryUnlock(pass, silent){
  const cands = passVariants(pass);
  if(!cands.length){
    if(!silent){ gerr.textContent = 'Enter the passphrase from your session invite.'; }
    else { document.getElementById('gate').style.display = 'flex'; }
    return;
  }
  gerr.textContent = silent ? '' : 'Checking\u2026';
  let d = null, accepted = null;
  for(const c of cands){
    try{ d = await decryptPayload(c); accepted = c; break; }
    catch(e){ /* try the next repaired form */ }
  }
  if(d){
    try{ sessionStorage.setItem("swa-labs-key", accepted); }catch(e){}
    document.getElementById('gate').remove();
    const app = document.getElementById('app');
    app.innerHTML = d.html;
    app.style.display = 'block';
    const _origAdd = document.addEventListener.bind(document);
    document.addEventListener = function(type, fn, opts){
      if(type === 'DOMContentLoaded'){ try{ fn(new Event(type)); }catch(e){ console.error(e); } return; }
      return _origAdd(type, fn, opts);
    };
    const _winAdd = window.addEventListener.bind(window);
    window.addEventListener = function(type, fn, opts){
      if(type === 'load'){ try{ fn(new Event(type)); }catch(e){ console.error(e); } return; }
      return _winAdd(type, fn, opts);
    };
    const s = document.createElement('script');
    s.textContent = d.js;
    document.body.appendChild(s);
    document.addEventListener = _origAdd;
    window.addEventListener = _winAdd;
  } else {
    if(!silent){
      gerr.textContent = 'That passphrase did not work. Check your session invite \u2014 '
        + 'if you pasted it, try typing it instead.';
    }
    else { document.getElementById('gate').style.display = 'flex'; }
  }
}
document.getElementById('unlock').onclick = () => tryUnlock(document.getElementById('pw').value, false);
document.getElementById('pw').addEventListener('keydown', e => {
  if(e.key === 'Enter'){ e.preventDefault(); document.getElementById('unlock').click(); }
});
(function(){
  let k = null;
  try{ k = sessionStorage.getItem("swa-labs-key"); }catch(e){}
  if(k){ document.getElementById('gate').style.display = 'none'; tryUnlock(k, true); }
  else { setTimeout(() => { const el = document.getElementById('pw'); if(el) el.focus(); }, 80); }
})();
</script>
